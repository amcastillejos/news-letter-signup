<!DOCTYPE html>
  <html lang="en">
    <head>
      <title>Stay Updated - Weekly Product Management Newsletter</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width">
      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="container">
            <div class="form-wrapper">
                <div class="content">
                    <h1 class="heading">Stay Updated</h1>
                    <p class="para-text">Join 60,000 product managers who receive our weekly newsletter.</p>

                     <fieldset>
                        <legend>What you'll get in the newsletter:</legend>
                        <ul class="updates">
                          <!-- checkbox list here -->
                          <li class="bullets">
                            <label>
                             <input type="checkbox" name="updates" checked>
                             <span class="bullet-text">Product discovery and building what matters</span>
                            </label>
                        </li>
                        <li class="bullets">
                          <label>
                            <input type="checkbox" name="updates" checked>
                            <span class="bullet-text">Measureing to ensure updates are a success</span>
                          </label>  
                        </li>
                        <li class="bullets">
                          <label>
                            <input type="checkbox" name="updates" checked>
                            <span class="bullet-text">And much more!</span>
                          </label>  
                        </li>
                        </ul>
                      </fieldset>

                    <form action="submit" class="signup-form">
                        <label for="email" class="emailLabel">Email Address</label>
                    <input type="text" class="emailInput" id="email" name="email" placeholder="youremail@email.com" required/>
                    <button type="submit" class="submitBtn">Subscribe to Monthly Newsletters</button>
                    <p class="success-message" id="successMsg" hidden>Thanks for subscribing!</p>
                    </form>
                </div>
                <div class="image">
                                 
                    <img src="newsletter-signup.png" class="img" alt="Illustration of a person subscribing to a newsletter" />

                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
  </html>
